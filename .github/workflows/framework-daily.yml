name: Framework Refresh (Tom 7Q daily)

on:
  schedule:
    # 04:00 IST = 22:30 UTC, every day
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Run 7-Q framework refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        id: framework
        continue-on-error: true
        run: python scripts/analyze_framework.py
      - name: Report framework skip
        if: steps.framework.outcome == 'failure'
        run: |
          echo "::warning::Framework refresh failed, usually because Anthropic credits are unavailable. Keeping the last published data."
      - name: Commit + push with rebase-retry
        if: steps.framework.outcome == 'success'
        run: |
          git config user.name  "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          git add data/framework.json
          if git diff --cached --quiet -- data/framework.json; then
            echo "framework.json unchanged"; exit 0
          fi
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "Tom 7Q framework refresh ${DATE} [skip ci]"
          for a in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main; git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 2
          done; exit 1
