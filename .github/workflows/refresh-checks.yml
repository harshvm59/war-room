name: Refresh regression checks

on:
  push:
    paths:
      - 'index.html'
      - 'data/*.js'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'index.html'
      - 'data/*.js'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/test_refresh.mjs
      - run: node scripts/test_cohort_planner.mjs
