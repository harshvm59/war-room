name: Themes Refresh (daily)

on:
  # DISABLED: this refresh calls the Anthropic API, which needs paid credits.
  # The account is out of credits, so a scheduled run only fails. Re-enable by
  # uncommenting the schedule once credits are funded.
  # schedule:
  #   - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: themes-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Run themes refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_themes.py
      - name: Commit + push with rebase-retry
        run: |
          git config user.name  "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          if git diff --quiet -- data/themes.json; then exit 0; fi
          DATE=$(date -u +"%Y-%m-%d")
          git add data/themes.json
          git commit -m "Themes refresh ${DATE} [skip ci]"
          for a in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main; git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 2
          done; exit 1
