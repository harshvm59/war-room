name: Themes + Cohorts Refresh (3x daily)

on:
  schedule:
    # 09:15 IST: morning research and cohort refresh.
    - cron: "45 3 * * *"
    # 19:15 IST weekdays: refresh candidates and reference prices near US open.
    - cron: "45 13 * * 1-5"
    # 23:15 IST weekdays: refresh the cohort during the US session.
    - cron: "45 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: themes-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Run themes refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        id: themes
        continue-on-error: true
        run: python scripts/update_themes.py
      - name: Report themes skip
        if: steps.themes.outcome == 'failure'
        run: |
          echo "::warning::Themes refresh failed, usually because Anthropic credits are unavailable. Keeping the last published data."
      - name: Commit + push with rebase-retry
        if: steps.themes.outcome == 'success'
        run: |
          git config user.name  "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          if git diff --quiet -- data/themes.json; then exit 0; fi
          DATE=$(date -u +"%Y-%m-%d")
          git add data/themes.json
          git commit -m "Themes refresh ${DATE} [skip ci]"
          for a in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main; git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 2
          done; exit 1
