name: Agent Operations Heartbeat

on:
  schedule:
    # 24/7 online research heartbeat: once per hour, at :15 UTC.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Build live research workboard
        run: python scripts/agent_heartbeat.py
      - name: Commit agent workboard
        run: |
          git config user.name "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          git add data/agent_ops.json
          if git diff --cached --quiet; then
            echo "agent_ops.json unchanged"; exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%d %H:%MZ")
          git commit -m "Agent heartbeat ${STAMP} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt ${attempt}"; exit 0; fi
            git fetch origin main
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 2
          done
          exit 1
