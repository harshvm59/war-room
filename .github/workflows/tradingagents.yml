name: TradingAgents research
on:
  schedule:
    # Sunday 09:45 IST. Paid research is deliberately weekly within the shared budget.
    - cron: '15 4 * * 0'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Current holding ticker (blank rotates automatically); one attempt per IST week'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install base dependencies
        run: pip install -r scripts/requirements.txt
      - name: Install pinned TradingAgents only when configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            pip install -r scripts/requirements-tradingagents.txt -c scripts/constraints-tradingagents.txt
          fi
      - name: Generate read-only research
        id: research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          HVM_TICKER: ${{ inputs.ticker }}
        run: python scripts/tradingagents_runner.py --ticker "$HVM_TICKER"
      - name: Publish research or blocker
        if: always() && steps.research.outcome != 'skipped'
        run: |
          git config user.name war-room-bot
          git config user.email war-room-bot@users.noreply.github.com
          git add data/tradingagents.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish TradingAgents research status [skip ci]'
          git pull --rebase origin main
          git push
