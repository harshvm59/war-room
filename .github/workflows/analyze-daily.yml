name: Daily TA Analysis

# Schedule: hourly during US market hours + once post-close.
# US market: 13:30-20:00 UTC EDT (winter: 14:30-21:00 UTC EST).
# Hourly during market: catches morning open, mid-day, late-day moves.
# 21:30 UTC = post-close summary (= 3 AM IST next morning).

on:
  schedule:
    # Hourly at the top of each market hour (14:00..20:00 UTC, Mon-Fri)
    - cron: "0 14-20 * * 1-5"
    # Post-close end-of-day summary
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run daily TA analysis + Telegram push
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/analyze_daily.py

      - name: Commit if changed
        run: |
          git config user.name  "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          if git diff --quiet -- data/actions.json; then
            echo "actions.json unchanged — skipping commit."
            exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%d %H:%MZ")
          git add data/actions.json
          git commit -m "TA refresh ${STAMP} [skip ci]"
          git push
