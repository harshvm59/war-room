name: Daily TA Analysis

on:
  schedule:
    - cron: "0,30 14-20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Run daily TA analysis + Telegram push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/analyze_daily.py
      - name: Commit + push with rebase-retry
        run: |
          git config user.name  "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          if git diff --quiet -- data/actions.json data/prices.json data/analysis.json; then
            echo "actions.json/prices.json unchanged - skipping commit."
            exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%d %H:%MZ")
          git add data/actions.json data/prices.json data/analysis.json data/analysis.json
          git commit -m "TA refresh ${STAMP} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then echo "Pushed on attempt ${attempt}"; exit 0; fi
            echo "rebasing..."
            git fetch origin main
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 2
          done
          exit 1
