name: Daily News + YouTube Scrape

on:
  schedule:
    # 09:00 IST: morning leader/news packet.
    - cron: "30 3 * * *"
    # 19:05 IST weekdays: refresh near the US open.
    - cron: "35 13 * * 1-5"
    # 23:05 IST weekdays: refresh during the US session.
    - cron: "35 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run daily scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        id: scrape
        continue-on-error: true
        run: python scripts/update_news_youtube.py

      - name: Report scrape skip
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::News/YouTube refresh failed, usually because Anthropic credits are unavailable. Keeping the last published data."

      - name: Commit if changed
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name  "war-room-bot"
          git config user.email "war-room-bot@users.noreply.github.com"
          if git diff --quiet -- data/news.json data/youtube.json data/voices.json; then
            echo "No new news/youtube/voices content — skipping commit."
            exit 0
          fi
          DATE=$(date -u +"%Y-%m-%d")
          git add data/news.json data/youtube.json data/voices.json
          git commit -m "Daily news + YouTube scrape ${DATE} [skip ci]"
          for a in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 2
          done
          exit 1
